# Publishes every @scriba-editor/* package to npm when a version tag (v0.1.0, …) is
# pushed, or by hand (Actions ▸ Release ▸ Run workflow) for an existing tag.
# Provenance links each package to this repository and to this run
# (CLAUDE.md §5.12). See RELEASING.md before the first release.
#
# Packages are published one at a time and versions already on npm are skipped,
# so a run can be repeated after a partial failure. npm limits how many NEW
# packages can be created in a short time (429): the manual run can wait between
# packages and retries after a pause.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (an existing tag without the "v", e.g. 0.1.0)'
        required: true
        type: string
      delay_minutes:
        description: 'Minutes to wait between two packages'
        required: false
        default: '5'
        type: string

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: npm
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      DELAY_MINUTES: ${{ inputs.delay_minutes || '0' }}
    steps:
      # a manual run publishes exactly the code of the tag, not the tip of the branch
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the tag must match the version of every package
      - name: Check the version
        run: |
          node -e '
            const { execSync } = require("node:child_process")
            const tag = process.env.VERSION.replace(/^v/, "")
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(tag)) {
              console.error("Not a version: " + tag)
              process.exit(1)
            }
            const list = JSON.parse(execSync("pnpm -r ls --depth -1 --json").toString())
            const wrong = list.filter((p) => !p.private && p.version !== tag)
            if (wrong.length) {
              console.error("Version differs from the tag " + tag + ":", wrong.map((p) => p.name + "@" + p.version).join(", "))
              process.exit(1)
            }'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm build
      - name: Publish
        env:
          # first release: a granular npm token saved as the NPM_TOKEN secret of the
          # "npm" environment; afterwards trusted publishing (OIDC) needs no token
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          names=$(pnpm -r ls --depth -1 --json | node -e '
            let s = ""
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              for (const p of JSON.parse(s)) if (!p.private) console.log(p.name)
            })')
          published=0
          for name in $names; do
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            if [ "$published" -gt 0 ] && [ "$DELAY_MINUTES" -gt 0 ]; then
              echo "Waiting $DELAY_MINUTES minutes before $name"
              sleep $((DELAY_MINUTES * 60))
            fi
            for attempt in 1 2 3 4; do
              if pnpm --filter "$name" publish --access public --provenance --no-git-checks; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::$name not published after $attempt attempts; run the workflow again later"
                exit 1
              fi
              echo "::warning::$name failed (attempt $attempt), new attempt in 20 minutes"
              sleep 1200
            done
            published=$((published + 1))
          done
          echo "Published $published packages"
